[project]
    name = "dynamic-pruning"
    version = "0.1.0"
    description = "Runtime-adjustable dynamic channel pruning via target-conditioned decision heads."
    requires-python = ">=3.11"
    dependencies = [
        "onnx==1.22.0",
        "onnxoptimizer==0.4.2",
        "onnxruntime==1.27.0",
        "onnxsim==0.6.5",
        "onnxconverter-common==1.16.0",
        "torch==2.12.1",
        "torchvision==0.27.1",
        "pandas==3.0.3",        # needed for deep-learning-HAR utilities
        "hydra-core==1.3.4",
        "omegaconf==2.3.1",
        "tensorboard==2.21.0",
        "optuna==4.9.0",
    ]

    [project.optional-dependencies]
        # KWS (keyword spotting) dataset preprocessing. tensorflow is used once to
        # run the ARM ML-KWS-for-MCU frozen graph and compute MFCCs from raw audio;
        # after the first run, results are cached and tensorflow is no longer needed.
        # Note: TensorFlow does not publish wheels for Python 3.13+ — use a 3.11/3.12
        # venv for this extra if your environment is too new.
        kws = ["tensorflow>=2.12,<3", "filelock>=3.13", "platformdirs>=4.0", "torchaudio==2.11.0"]

[tool.setuptools.packages.find]
    include = ["dynamic_pruning*", "scripts*"]

[build-system]
    requires      = ["setuptools>=68"]
    build-backend = "setuptools.build_meta"
