# @package _global_
# Stage 1 — pretrain the backbone with no pruning.
defaults:
  - /pretrain_schema
  - /data: cifar10
  - /model: resnet56
  - _self_

epochs: 160
log_interval: 100
seed: 0

data:
  # Paper's Stage 1 recipe (lr=0.1 default, see common.py) is tuned for
  # batch_size=128 from scratch; the shared cifar10.yaml default of 512
  # is right for Stage 2/2D but starves Stage 1 convergence if inherited here.
  train_batch_size: 128

optim:
  weight_decay: 1e-4
  label_smoothing: 0.1

# Enable Stage-1-only spatial dropout (safe: no gating yet, Dropout2d
# has no learnable parameters so it can't affect checkpoint
# compatibility with Stage 2/2D onward):
model:
  dropout_prob: 0.1
