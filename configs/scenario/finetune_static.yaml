# @package _global_
# Stage 3 — fine-tune the backbone (gates frozen, deterministic) at a single
# operating point. Loads the Stage 2 checkpoint at the same sparsity_level.
defaults:
  - /finetune_schema
  - /data: cifar10
  - /model: resnet56
  - _self_

dynamic: false
sparsity_level: 0.4
epochs: 160
log_interval: 100
seed: 0

decision:
  action_num: 40
  pruning_threshold: 0.5

optim:
  lr: 0.001
  weight_decay: 1e-4
  label_smoothing: 0.1
